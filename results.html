<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Results</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Form Results</h1>
    <p class="lead">Here are the details you submitted:</p>

    <div id="results" class="results-box"></div>

    <div class="buttons">
      <a href="index.html" class="btn secondary">← Back to Form</a>
    </div>
  </main>

  <script>
    const resultsList = document.getElementById('results');
    const params = new URLSearchParams(window.location.search);

    if (params.toString().length === 0) {
      resultsList.innerHTML = "<p>No data received. Please go back and fill out the form.</p>";
    } else {
      const ul = document.createElement('ul');
      ul.style.listStyle = "none";
      ul.style.padding = "0";

      params.forEach((value, key) => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${key}:</strong> ${value}`;
        li.style.padding = "6px 0";
        li.style.borderBottom = "1px solid #e1eef8";
        ul.appendChild(li);
      });

      resultsList.appendChild(ul);
    }
  </script>
</body>
</html>
