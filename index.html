<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form with CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Registration Form</h1>
    <p>Please fill in all the fields below.</p>

    <form action="results.html" method="GET" enctype="multipart/form-data">
      <div class="row">
        <label>First Name
          <input type="text" name="fname" id="fname" placeholder="First Name" required>
        </label>
      </div>

      <div class="row">
        <label>Email
          <input type="email" name="email" id="email" placeholder="Email" required>
        </label>
      </div>

      <div class="row">
        <label>Age
          <input type="number" name="age" id="age" min="18" max="130" step="1" placeholder="Enter Age" required>
        </label>
      </div>

      <div class="row">
        <label>Birthday
          <input type="date" name="birthday" id="birthday" required>
        </label>
      </div>

      <div class="row">
        <label>Phone
          <input type="tel" name="phone" id="phone" placeholder="+1 555 555 5555">
        </label>
      </div>

      <fieldset class="row">
        <legend>Favorite Season</legend>
        <label><input type="checkbox" name="winter"> Winter</label>
        <label><input type="checkbox" name="summer"> Summer</label>
      </fieldset>

      <fieldset class="row">
        <legend>Do you prefer Night or Day?</legend>
        <label><input type="radio" name="preference" value="Night"> Night</label>
        <label><input type="radio" name="preference" value="Day"> Day</label>
      </fieldset>

      <div class="row">
        <label for="faveDay">Favorite Weekday</label>
        <select name="faveDay" id="faveDay" multiple>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
          <option value="Sunday">Sunday</option>
        </select>
      </div>

      <div class="row">
        <label>Password
          <input type="password" name="password" id="password" placeholder="Password" required>
        </label>
      </div>

      <div class="row">
        <label>Website
          <input type="url" name="website" id="website" placeholder="https://">
        </label>
      </div>

      <div class="row">
        <label>Favorite Color
          <input type="color" name="favecolor" id="favecolor">
        </label>
      </div>

      <div class="row">
        <label for="opinion">Tell us what you think</label>
        <textarea name="opinion" id="opinion" rows="4" placeholder="Share your thoughts..."></textarea>
      </div>

      <div class="row">
        <label for="fileUpload">Upload a File</label>
        <input type="file" name="fileUpload" id="fileUpload">
      </div>

      <input type="hidden" name="sessionId" value="secretRandomSessionValue">

      <div class="row buttons">
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>
</body>
</html>
